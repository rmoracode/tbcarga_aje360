name: Descargar DATA PARA ANALISIS (Tableau)

on:
  workflow_dispatch:
    inputs:
      mes_objetivo:
        description: "Mes a marcar (ej. agosto)"
        required: false
        default: "agosto"
      mes_a_desmarcar:
        description: "Mes actualmente marcado a desmarcar (vacio = ninguno)"
        required: false
        default: "mayo"
  schedule:
    # 12:00 UTC = 06:00 Guatemala (UTC-6). Corre las 10 sucursales + combina +
    # sube a Drive automaticamente, sin que nadie lo dispare.
    - cron: "0 12 * * *"

jobs:
  descargar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        sucursal:
          - "AJEMAYA SUCURSAL BARBERENA"
          - "AJEMAYA SUCURSAL MIXCO"
          - "AJEMAYA SUCURSAL QUETZALTENANGO"
          - "CEDI AMATITLAN"
          - "CEDIS CHIMALTENANGO"
          - "CEDIS MAZATENANGO"
          - "CEDIS TECULUTAN"
          - "PLANTA AMATITLAN - BEBIDAS"
          - "RUTA EL ATLANTICO"
          - "VILLA NUEVA"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Descargar vista de Tableau
        env:
          TABLEAU_STORAGE_STATE: ${{ secrets.TABLEAU_STORAGE_STATE }}
          SUCURSAL: ${{ matrix.sucursal }}
          MES_OBJETIVO: ${{ github.event.inputs.mes_objetivo || 'agosto' }}
          MES_A_DESMARCAR: ${{ github.event.inputs.mes_a_desmarcar || 'mayo' }}
          SALIDA_DIR: ./salida
        run: python scripts/descargar.py

      - name: Subir resultado como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salida-${{ matrix.sucursal }}
          path: salida/
          retention-days: 14

  combinar_y_subir:
    needs: descargar
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar todos los CSV generados
        uses: actions/download-artifact@v4
        with:
          pattern: salida-*
          path: todos/
          merge-multiple: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pandas
        run: pip install pandas

      - name: Combinar en un solo archivo
        run: |
          mkdir -p combinado
          python scripts/combinar.py todos/ "combinado/${{ github.event.inputs.mes_objetivo || 'agosto' }}_2026_todas_sucursales.csv"

      - name: Subir combinado como artifact
        uses: actions/upload-artifact@v4
        with:
          name: agosto-combinado
          path: combinado/

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Subir a Google Drive
        run: |
          rclone copy combinado/ "gdrive_aje:" -v
