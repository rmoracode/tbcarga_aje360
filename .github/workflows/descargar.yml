name: Descargar DATA PARA ANALISIS (Tableau)

on:
  workflow_dispatch:
    inputs:
      mes_objetivo:
        description: "Mes a marcar (ej. agosto)"
        required: false
        default: "agosto"
      mes_a_desmarcar:
        description: "Mes actualmente marcado a desmarcar (vacio = ninguno)"
        required: false
        default: "mayo"
  # Sin `schedule:` a propósito (2026-08-09): antes corría por su propio cron a las
  # 06:00 GT Y por el disparo del sincronizador de ajecam360 (servicios/
  # sincronizador_datos.py, ~05:30 GT) -- dos disparos casi seguidos duplicaban la
  # carga de 10 sesiones simultáneas sobre Tableau, justo lo que causó el bug de
  # datos mezclados ese día. Ahora ajecam360 es el único disparador: dispara, ESPERA,
  # VALIDA, y reintenta hasta 3 veces si algo sale mal -- un cron ciego no podía hacer
  # nada de eso. Si ajecam360 llegara a estar caído, disparar manual acá
  # (workflow_dispatch) sigue funcionando igual.

jobs:
  setup:
    # Fuente unica de la lista de sucursales (scripts/sucursales.py) -- antes
    # solo vivia hardcodeada en la matriz de abajo, asi que no habia contra
    # que validar que el combinado quedo completo.
    runs-on: ubuntu-latest
    outputs:
      sucursales: ${{ steps.leer.outputs.sucursales }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - id: leer
        run: echo "sucursales=$(python3 scripts/sucursales.py --json)" >> "$GITHUB_OUTPUT"

  descargar:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        sucursal: ${{ fromJson(needs.setup.outputs.sucursales) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Calcular mes en curso
        # Antes el mes/mes-a-desmarcar en corridas de cron (sin inputs) caían al
        # fallback hardcodeado 'agosto'/'mayo' -- correcto hoy por coincidencia,
        # pero se habría roto en silencio en septiembre (mismo patrón ya
        # arreglado en descargar_incentivos.yml, esto se le había quedado atrás).
        id: mes
        run: |
          MESES=(enero febrero marzo abril mayo junio julio agosto septiembre octubre noviembre diciembre)
          MES_NUM=$(date -u +%-m)
          MES_ACTUAL="${MESES[$((MES_NUM - 1))]}"
          MES_PREV="${MESES[$(((MES_NUM - 2 + 12) % 12))]}"
          echo "actual=$MES_ACTUAL" >> "$GITHUB_OUTPUT"
          echo "previo=$MES_PREV" >> "$GITHUB_OUTPUT"

      - name: Descargar vista de Tableau
        env:
          TABLEAU_USER: ${{ secrets.TABLEAU_USER }}
          TABLEAU_PASSWORD: ${{ secrets.TABLEAU_PASSWORD }}
          SUCURSAL: ${{ matrix.sucursal }}
          MES_OBJETIVO: ${{ github.event.inputs.mes_objetivo != '' && github.event.inputs.mes_objetivo || steps.mes.outputs.actual }}
          MES_A_DESMARCAR: ${{ github.event.inputs.mes_a_desmarcar != '' && github.event.inputs.mes_a_desmarcar || steps.mes.outputs.previo }}
          SALIDA_DIR: ./salida
        run: python scripts/descargar.py

      - name: Subir resultado como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salida-${{ matrix.sucursal }}
          path: salida/
          retention-days: 14
          if-no-files-found: warn

  reintentar_faltantes:
    # Red de seguridad: bajo carga de 10 sesiones simultaneas Tableau a veces no
    # dispara la descarga a tiempo (visto 2026-08-07: 4/10 sucursales con timeout,
    # y el job de abajo subio igual un combinado incompleto a Drive). Este job
    # corre SIEMPRE (if: always()), calcula que sucursales quedaron sin CSV ni
    # marker de "sin datos", y las reintenta UNA A LA VEZ (menos carga sobre
    # Tableau que reintentar en paralelo, y con mas margen de timeout).
    needs: [setup, descargar]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt pandas
          playwright install --with-deps chromium

      - name: Descargar artifacts de la primera pasada
        uses: actions/download-artifact@v4
        with:
          pattern: salida-*
          path: todos/
          merge-multiple: false

      - name: Calcular sucursales faltantes
        id: faltantes
        run: |
          python3 - <<'PYEOF'
          import sys
          sys.path.insert(0, "scripts")
          from combinar import validar_completo
          faltantes = validar_completo("todos")
          print(f"Faltantes tras la primera pasada: {faltantes}")
          with open("faltantes.txt", "w") as f:
              for s in faltantes:
                  f.write(s + "\n")
          PYEOF

      - name: Calcular mes en curso
        id: mes
        run: |
          MESES=(enero febrero marzo abril mayo junio julio agosto septiembre octubre noviembre diciembre)
          MES_NUM=$(date -u +%-m)
          MES_ACTUAL="${MESES[$((MES_NUM - 1))]}"
          MES_PREV="${MESES[$(((MES_NUM - 2 + 12) % 12))]}"
          echo "actual=$MES_ACTUAL" >> "$GITHUB_OUTPUT"
          echo "previo=$MES_PREV" >> "$GITHUB_OUTPUT"

      - name: Reintentar cada sucursal faltante (serial, timeout ampliado)
        if: hashFiles('faltantes.txt') != ''
        env:
          TABLEAU_USER: ${{ secrets.TABLEAU_USER }}
          TABLEAU_PASSWORD: ${{ secrets.TABLEAU_PASSWORD }}
          MES_OBJETIVO: ${{ github.event.inputs.mes_objetivo != '' && github.event.inputs.mes_objetivo || steps.mes.outputs.actual }}
          MES_A_DESMARCAR: ${{ github.event.inputs.mes_a_desmarcar != '' && github.event.inputs.mes_a_desmarcar || steps.mes.outputs.previo }}
          SALIDA_DIR: ./salida_retry
        run: |
          if [ ! -s faltantes.txt ]; then
            echo "Nada que reintentar -- las 10 sucursales resolvieron a la primera."
            exit 0
          fi
          mkdir -p "$SALIDA_DIR"
          while IFS= read -r suc; do
            [ -z "$suc" ] && continue
            echo "=== Reintentando: $suc ==="
            SUCURSAL="$suc" python scripts/descargar.py || echo "Sigue fallando: $suc"
          done < faltantes.txt

      - name: Subir reintentos como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salida-reintentos
          path: salida_retry/
          retention-days: 14
          if-no-files-found: ignore

  combinar_y_subir:
    needs: [descargar, reintentar_faltantes]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descargar todos los CSV generados (primera pasada + reintentos)
        uses: actions/download-artifact@v4
        with:
          pattern: salida-*
          path: todos/
          merge-multiple: false

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar pandas
        run: pip install pandas

      - name: Calcular mes en curso
        id: mes
        run: |
          MESES=(enero febrero marzo abril mayo junio julio agosto septiembre octubre noviembre diciembre)
          MES_NUM=$(date -u +%-m)
          ANIO=$(date -u +%Y)
          MES_ACTUAL="${MESES[$((MES_NUM - 1))]}"
          echo "actual=$MES_ACTUAL" >> "$GITHUB_OUTPUT"
          echo "anio=$ANIO" >> "$GITHUB_OUTPUT"

      - name: Combinar en un solo archivo (valida completitud + filtra mes mezclado)
        id: combinar
        env:
          MES: ${{ github.event.inputs.mes_objetivo != '' && github.event.inputs.mes_objetivo || steps.mes.outputs.actual }}
          ANIO: ${{ steps.mes.outputs.anio }}
        run: |
          mkdir -p combinado
          python scripts/combinar.py todos/ "combinado/${MES}_${ANIO}_todas_sucursales.csv" \
            --esperadas --mes-objetivo "${MES} de ${ANIO}" | tee combinar.log
          if grep -q "⚠ RESUMEN" combinar.log; then
            echo "sucias=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Alertar por Telegram si quedó incompleto
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$ADMIN_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/ADMIN_CHAT_ID no configurados en este repo -- se omite la alerta."
            echo "Agregalos en Settings > Secrets and variables > Actions si querés notificación por Telegram."
            exit 0
          fi
          FALTANTES=$(python3 -c "
          import sys; sys.path.insert(0, 'scripts')
          from combinar import validar_completo
          print(', '.join(validar_completo('todos')) or 'desconocido')
          ")
          MES="${{ github.event.inputs.mes_objetivo || steps.mes.outputs.actual }}"
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXTO="⚠️ tbcarga_aje360: el acumulado de ${MES} quedó INCOMPLETO tras reintentar. Faltan: ${FALTANTES}. NO se subió nada a Drive -- se conserva el archivo del día anterior. Ver: ${URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${ADMIN_CHAT_ID}" \
            --data-urlencode text="${TEXTO}" > /dev/null

      - name: Avisar por Telegram si se auto-corrigió un mes mezclado (no bloquea)
        if: steps.combinar.outputs.sucias == 'si'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$ADMIN_CHAT_ID" ]; then
            exit 0
          fi
          URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXTO="ℹ️ tbcarga_aje360: alguna sucursal trajo el CSV con meses mezclados -- se descartaron esas filas automáticamente y el archivo subido a Drive quedó correcto. Si se repite seguido, revisar scripts/descargar.py. Log: ${URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${ADMIN_CHAT_ID}" \
            --data-urlencode text="${TEXTO}" > /dev/null

      - name: Subir combinado como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.mes_objetivo != '' && github.event.inputs.mes_objetivo || steps.mes.outputs.actual }}-combinado
          path: combinado/

      - name: Instalar rclone
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Subir a Google Drive
        run: |
          rclone copy combinado/ "gdrive_aje:" -v
