name: Descargar DATA PARA ANALISIS (Tableau)

on:
  workflow_dispatch:
    inputs:
      sucursal:
        description: "Sucursal a descargar"
        required: false
        default: "AJEMAYA SUCURSAL BARBERENA"
      mes_objetivo:
        description: "Mes a marcar (ej. agosto)"
        required: false
        default: "agosto"
      mes_a_desmarcar:
        description: "Mes actualmente marcado a desmarcar (vacio = ninguno)"
        required: false
        default: ""
  schedule:
    # 12:00 UTC = 06:00 Guatemala. Desactivado hasta confirmar la primera
    # corrida manual exitosa -- descomentar cuando este validado.
    # - cron: "0 12 * * *"

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Descargar vista de Tableau
        env:
          TABLEAU_STORAGE_STATE: ${{ secrets.TABLEAU_STORAGE_STATE }}
          SUCURSAL: ${{ github.event.inputs.sucursal || 'AJEMAYA SUCURSAL BARBERENA' }}
          MES_OBJETIVO: ${{ github.event.inputs.mes_objetivo || 'agosto' }}
          MES_A_DESMARCAR: ${{ github.event.inputs.mes_a_desmarcar || '' }}
          SALIDA_DIR: ./salida
        run: python scripts/descargar.py

      - name: Subir resultado como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: salida-tableau
          path: salida/
          retention-days: 14
