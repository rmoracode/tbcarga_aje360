name: Descargar Incentivos Comerciales (Tableau)

on:
  workflow_dispatch:
    inputs:
      mes_objetivo:
        description: "Mes a marcar (vacio = el mes en curso, calculado solo)"
        required: false
        default: ""
      mes_a_desmarcar:
        description: "Mes actualmente marcado a desmarcar (vacio = el mes anterior, calculado solo)"
        required: false
        default: ""
  # Dispara justo cuando TERMINA "Descargar DATA PARA ANALISIS (Tableau)" (el de
  # ventas) -- ya no un cron a horario fijo (12:15 UTC, "15 min despues") que podia
  # pisarlo si ventas se demoraba, o dejar un hueco muerto si terminaba antes. Corre
  # sin importar si ventas tuvo exito o fallo (son fuentes de datos independientes;
  # lo unico que importa acá es no loguearse a Tableau al mismo tiempo que ventas).
  workflow_run:
    workflows: ["Descargar DATA PARA ANALISIS (Tableau)"]
    types: [completed]

jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      # Calcula el mes en curso (y el anterior) en español, en vez de tener
      # "agosto"/"mayo" fijos en el YAML -- eso se rompería solo en septiembre.
      # Solo se usa como fallback: si mes_objetivo vino explícito (workflow_dispatch
      # manual), ese gana.
      - name: Calcular mes en curso
        id: mes
        run: |
          MESES=(enero febrero marzo abril mayo junio julio agosto septiembre octubre noviembre diciembre)
          MES_NUM=$(date -u +%-m)
          MES_ACTUAL="${MESES[$((MES_NUM - 1))]}"
          MES_PREV="${MESES[$(((MES_NUM - 2 + 12) % 12))]}"
          echo "actual=$MES_ACTUAL" >> "$GITHUB_OUTPUT"
          echo "previo=$MES_PREV" >> "$GITHUB_OUTPUT"
          echo "Mes calculado: $MES_ACTUAL (anterior: $MES_PREV)"

      - name: Descargar vista de Incentivos
        env:
          TABLEAU_USER: ${{ secrets.TABLEAU_USER }}
          TABLEAU_PASSWORD: ${{ secrets.TABLEAU_PASSWORD }}
          MES_OBJETIVO: ${{ github.event.inputs.mes_objetivo != '' && github.event.inputs.mes_objetivo || steps.mes.outputs.actual }}
          MES_A_DESMARCAR: ${{ github.event.inputs.mes_a_desmarcar != '' && github.event.inputs.mes_a_desmarcar || steps.mes.outputs.previo }}
          SALIDA_DIR: ./salida
        run: python scripts/descargar_incentivos.py

      - name: Subir resultado como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incentivos-${{ github.event.inputs.mes_objetivo != '' && github.event.inputs.mes_objetivo || steps.mes.outputs.actual }}
          path: salida/
          retention-days: 14

      - name: Instalar rclone
        if: success()
        run: curl https://rclone.org/install.sh | sudo bash

      - name: Configurar rclone
        if: success()
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Subir CSV a Google Drive
        if: success()
        run: |
          rclone copy salida/ "gdrive_aje:incentivos/" -v --include "*.csv"
